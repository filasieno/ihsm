name: Setup Nix
description: >-
  Install upstream (plain) Nix with flakes enabled.

  Attic (nix.1tdb.io) is temporarily disabled — re-enable substituters and
  ryanccn/attic-action in this action when the cluster cache is back.

runs:
  using: composite
  steps:
    # Plain upstream Nix — no Determinate Systems installer / magic-nix-cache.
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
