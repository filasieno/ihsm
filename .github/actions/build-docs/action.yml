name: Build documentation site
description: Build the Docusaurus site with interactive React tutorials.

inputs:
  attic-token:
    description: Push/pull token for the nix.1tdb.io Attic cache (optional).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: ./.github/actions/nix
      with:
        attic-token: ${{ inputs.attic-token }}

    - name: Build site
      run: nix build .#docs --print-build-logs
      shell: bash

    - name: Stage dist for Pages artifact
      run: |
        rm -rf packages/ihsm/docs-build
        mkdir -p packages/ihsm/docs-build
        cp -r result/share/doc/ihsm/* packages/ihsm/docs-build/
      shell: bash
