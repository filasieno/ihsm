name: Build documentation site
description: Build the Docusaurus site with interactive React tutorials.

runs:
  using: composite
  steps:
    - name: Setup Nix
      uses: ./.github/actions/nix

    - name: Build site
      run: nix build .#docs --print-build-logs
      shell: bash

    - name: Stage dist for Pages artifact
      run: |
        rm -rf site/build-pages
        mkdir -p site/build-pages
        cp -r result/share/doc/ihsm/* site/build-pages/
      shell: bash
