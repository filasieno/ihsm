name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Build & test (Nix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/nix

      - name: Build library and run tests
        run: nix flake check --print-build-logs

  coveralls:
    name: Coverage upload
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/nix

      - name: Generate lcov
        run: nix develop --command bash -c 'npm test && npm run coverage'

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/nix

      - name: Build documentation site
        run: nix build .#docs --print-build-logs

      - name: Verify site output
        run: bash scripts/verify-docs-site.sh site/build-pages
