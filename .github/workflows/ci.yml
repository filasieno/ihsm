name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    name: Nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: ./.github/actions/nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --check flake.nix

      - name: Build, test, lint, and docs
        run: nix flake check --print-build-logs

  coveralls:
    name: Coverage upload
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: ./.github/actions/nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      # nyc instruments test:node only; browser suites are already exercised in
      # the nix flake check job (with Chromium from the Nix store).
      - name: Generate lcov
        run: nix develop --command bash -c 'npm run test:node && npm run coverage'

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
