name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. 0.0.19)'
        required: true

permissions:
  contents: write
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  release:
    name: Test, publish npm, GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # workflow_dispatch must checkout the tag ref, not default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nix
        uses: ./.github/actions/nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Verify version matches tag
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          PKG="$(jq -r .version package.json)"
          case "${TAG}" in
            v*) echo "Tags must not use a v prefix (expected ${TAG#v}, got ${TAG})"; exit 1 ;;
          esac
          test "${PKG}" = "${TAG}" || {
            echo "package.json version ${PKG} does not match tag ${TAG}"
            exit 1
          }

      - name: Run Nix checks (build, test, lint, docs)
        run: nix flake check --print-build-logs

      - name: Stage built package for npm
        run: |
          nix build .#ihsm --print-build-logs -o result
          rm -rf lib
          cp -r result/lib ./lib

      # npm Trusted Publishing (OIDC) — no NPM_TOKEN / NODE_AUTH_TOKEN anywhere.
      # Package settings: npmjs.com/package/ihsm → Trusted publishing →
      # filasieno/ihsm, workflow release.yml, action npm publish.
      - name: Setup Node for npm publish (OIDC)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm via Trusted Publishing
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if npm view "ihsm@${VERSION}" version >/dev/null 2>&1; then
            echo "ihsm@${VERSION} is already published — skipping npm publish."
            exit 0
          fi
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const [a, b, c] = execSync('npm -v', { encoding: 'utf8' }).trim().split(/[.-]/).map(Number);
          if (a < 11 || (a === 11 && b < 5) || (a === 11 && b === 5 && c < 1)) {
            console.error(`npm ${a}.${b}.${c} too old for Trusted Publishing (need >= 11.5.1)`);
            process.exit(1);
          }
          NODE
          # Strip any token setup-node or a leftover GitHub secret may have written.
          npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
          npm config delete //registry.npmjs.org/:_authToken --location=project 2>/dev/null || true
          if grep -q '_authToken' .npmrc 2>/dev/null; then
            echo "Refusing to publish: project .npmrc still contains _authToken" >&2
            exit 1
          fi
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm publish --access public --ignore-scripts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          generate_release_notes: true
