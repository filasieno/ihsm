name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. 0.1.23)'
        required: true

permissions:
  contents: write
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  release:
    name: Test, publish npm, GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # workflow_dispatch must checkout the tag ref, not default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nix
        uses: ./.github/actions/nix

      - name: Verify package versions match tag
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          case "${TAG}" in
            v*) echo "Tags must not use a v prefix (expected ${TAG#v}, got ${TAG})"; exit 1 ;;
          esac
          for pkg in packages/ihsm packages/core packages/otel; do
            VER="$(jq -r .version "${pkg}/package.json")"
            test "${VER}" = "${TAG}" || {
              echo "${pkg}/package.json version ${VER} does not match tag ${TAG}"
              exit 1
            }
          done

      - name: Run Nix checks (build, test, lint, docs)
        run: nix flake check --print-build-logs

      - name: Build release artifacts (Nix)
        run: |
          set -euo pipefail
          nix build .#release --print-build-logs -o result
          rm -rf packages/ihsm/lib packages/core/lib packages/otel/lib
          cp -r result/ihsm/lib packages/ihsm/lib
          cp -r result/core/lib packages/core/lib
          cp -r result/otel/lib packages/otel/lib

      # npm Trusted Publishing (OIDC) — no NPM_TOKEN / NODE_AUTH_TOKEN anywhere.
      # Configure Trusted publishing on npm for: ihsm, @ihsm/core, @ihsm/otel
      # Repository filasieno/ihsm, workflow release.yml, action npm publish.
      - name: Setup Node for npm publish (OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm publish (OIDC, no tokens)
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const [a, b, c] = execSync('npm -v', { encoding: 'utf8' }).trim().split(/[.-]/).map(Number);
          if (a < 11 || (a === 11 && b < 5) || (a === 11 && b === 5 && c < 1)) {
            console.error(`npm ${a}.${b}.${c} too old for Trusted Publishing (need >= 11.5.1)`);
            process.exit(1);
          }
          NODE
          strip_npmrc() {
            local npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "${npmrc}" ]; then
              sed -i '/_authToken/d' "${npmrc}"
            fi
            npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
            npm config delete //registry.npmjs.org/:_authToken --location=project 2>/dev/null || true
          }
          strip_npmrc
          unset NODE_AUTH_TOKEN NPM_TOKEN

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.ref }}"
          strip_npmrc() {
            local npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "${npmrc}" ]; then
              sed -i '/_authToken/d' "${npmrc}"
            fi
            npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
            npm config delete //registry.npmjs.org/:_authToken --location=project 2>/dev/null || true
            unset NODE_AUTH_TOKEN NPM_TOKEN
          }
          publish_pkg() {
            local dir="$1"
            local name="$2"
            strip_npmrc
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
              echo "${name}@${VERSION} is already published — skipping."
              return 0
            fi
            cd "${dir}"
            if grep -q '_authToken' .npmrc 2>/dev/null; then
              echo "Refusing to publish: ${dir}/.npmrc still contains _authToken" >&2
              exit 1
            fi
            npm publish --access public --ignore-scripts --provenance
            cd - >/dev/null
          }
          publish_pkg packages/ihsm ihsm
          publish_pkg packages/core @ihsm/core
          publish_pkg packages/otel @ihsm/otel

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          generate_release_notes: true
