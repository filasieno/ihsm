name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. 0.0.19)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Test, publish npm, GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nix
        uses: ./.github/actions/nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Verify version matches tag
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          PKG="$(jq -r .version package.json)"
          case "${TAG}" in
            v*) echo "Tags must not use a v prefix (expected ${TAG#v}, got ${TAG})"; exit 1 ;;
          esac
          test "${PKG}" = "${TAG}" || {
            echo "package.json version ${PKG} does not match tag ${TAG}"
            exit 1
          }

      - name: Run Nix checks (build, test, lint, docs)
        run: nix flake check --print-build-logs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(jq -r .version package.json)"
          # Idempotent: a re-run (e.g. workflow_dispatch on an existing tag)
          # must not fail just because the version is already on the registry.
          if nix develop --command npm view "ihsm@${VERSION}" version >/dev/null 2>&1; then
            echo "ihsm@${VERSION} is already published — skipping npm publish."
            exit 0
          fi
          # Append registry auth to the project .npmrc (keeps engine-strict etc).
          # npm expands ${NODE_AUTH_TOKEN} at read time, so the token itself is
          # never written to disk; restore the pristine file afterwards.
          cp .npmrc .npmrc.release-bak
          trap 'mv .npmrc.release-bak .npmrc' EXIT
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> .npmrc
          nix develop --command npm publish --provenance --access public

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          generate_release_notes: true
