name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.0.18)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Test, publish npm, GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Nix
        uses: ./.github/actions/nix

      - name: Verify version matches tag
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          PKG="$(nix develop --command node -p "require('./package.json').version")"
          test "v${PKG}" = "${TAG}" || {
            echo "package.json version ${PKG} does not match tag ${TAG}"
            exit 1
          }

      - name: Run Nix checks (build, test, lint, docs)
        run: nix flake check --print-build-logs

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> "${HOME}/.npmrc"
          nix develop --command npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          generate_release_notes: true
